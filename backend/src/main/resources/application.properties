# ─── Server ───
server.port=8080
server.servlet.context-path=/api
spring.application.name=insurance-portal

# ─── MySQL Database (Production / Local) ───
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:insurance_portal}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ───
# No fallback on purpose — JWT_SECRET must be supplied (min 32 chars); startup fails otherwise.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000

# ─── Admin Bootstrap ───
# No password fallback on purpose — when ADMIN_PASSWORD is unset the admin account
# is not created (see InsurancePortalApplication#initDatabase).
app.admin.email=${ADMIN_EMAIL:admin@dicp.com.mm}
app.admin.password=${ADMIN_PASSWORD:}

# ─── Demo data ───
# Seeds demo agent/customer accounts with well-known passwords — local development only.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# ─── Login / AI rate limits (per IP, 15-minute window) ───
app.rate-limit.login=${RATE_LIMIT_LOGIN:10}
app.rate-limit.ai-chat=${RATE_LIMIT_AI_CHAT:20}

# ─── Google sign-in ───
# When set, Google access tokens are accepted only if issued for this client ID.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ─── File Upload ───
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${FILE_STORAGE_DIR:./uploads}

# ─── CORS ───
# Set CORS_ALLOWED_ORIGINS env var in production (comma-separated list)
# Falls back to localhost for dev convenience when env var not set
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5000}

# ─── Logging ───
logging.level.com.insurance=INFO
logging.level.org.springframework.security=WARN

# ─── SpringDoc / Swagger ───
# Disabled by default — the API schema is not public. Enable via SWAGGER_ENABLED=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ─── Auto-Check Scheduler ───
# Myanmar time = UTC+6:30
# 9 AM Myanmar = 2:30 AM UTC  → cron: 0 30 2 * * *
# 8 AM Myanmar = 1:30 AM UTC  → cron: 0 30 1 * * *
app.autocheck.verify-cron=${AUTOCHECK_VERIFY_CRON:0 30 2 * * *}
app.autocheck.reminder-cron=${AUTOCHECK_REMINDER_CRON:0 30 1 * * *}
app.autocheck.enabled=${AUTOCHECK_ENABLED:true}
# Minimum hours a payment must be PENDING before auto-verify (gives admin time to reject)
app.autocheck.min-pending-hours=${AUTOCHECK_MIN_PENDING_HOURS:1}
# Auto-cancel REVISION_REQUESTED applications/claims not answered within 7 days (03:00 UTC daily)
app.autocheck.revision-cleanup-cron=${AUTOCHECK_REVISION_CLEANUP_CRON:0 0 3 * * *}
